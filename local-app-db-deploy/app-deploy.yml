# YAML is case sensitive
# use spaces not a tab
apiVersion: apps/v1  # specify api to use for deployment
kind: Deployment  # kind of service/object you want to create
metadata:
  name: nodejs-deployment # name the deployment
spec:
  selector:
    matchLabels:
      app: nodejs  # look for this label/tag to match with k8 service
  # create a replica set of this with instances/pods
  replicas: 3
  template:
    metadata:
      labels:
        app: nodejs
      
    spec:
      containers:
      - name: nodejs
        image: hdaum123/tech610-tttapp:1.2.0 # the image you created to run nginx in a container
        ports:
        - containerPort: 3000
        env:
        - name: MONGODB_URI
          value: mongodb://mongodb-service:27017/tictactoe